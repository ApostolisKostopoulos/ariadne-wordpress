<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <title>Ariadne AI Assistant</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#17153b"/>
      <stop offset="1" stop-color="#262463"/>
    </linearGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <!-- The labyrinth's rings, large and faint, running off the right edge -->
  <g transform="translate(1110 -40) scale(9)" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="5" stroke-linecap="round">
    <path d="M24.83 56.99A26 26 0 1 1 39.17 56.99"/>
    <path d="M38.57 19.64A14 14 0 1 1 25.43 19.64"/>
  </g>
  <!-- The brand mark (apps/site/src/components/Logo.astro, variant labyrinth): 64 units, scaled 3.6 -->
  <g transform="translate(130 134) scale(3.6)">
    <g fill="none" stroke="#ece9f7" stroke-width="5" stroke-linecap="round">
      <path d="M24.83 56.99A26 26 0 1 1 39.17 56.99"/>
      <path d="M38.57 19.64A14 14 0 1 1 25.43 19.64"/>
    </g>
    <path d="M32 63V52A20 20 0 0 1 32 12V30" fill="none" stroke="#e8951a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="5" fill="#e8951a"/>
  </g>
  <g font-family="Commissioner, 'Segoe UI', Arial, sans-serif">
    <text x="420" y="262" font-size="128" font-weight="700" fill="#ffffff" letter-spacing="-2">Ariadne</text>
    <text x="424" y="338" font-size="44" font-weight="400" fill="#c9ccdb">AI assistant for your website and shop</text>
  </g>
</svg>
